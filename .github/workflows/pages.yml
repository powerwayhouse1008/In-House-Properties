name: Validate Powerway website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Vercel configuration
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json OK')"
      - name: Validate HTML scripts
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const file of fs.readdirSync('dist').filter((name) => name.endsWith('.html'))) {
            const source = fs.readFileSync(`dist/${file}`, 'utf8');
            for (const match of source.matchAll(/<script(?: src="[^"]+")?>([\s\S]*?)<\/script>/g)) {
              if (match[1].trim()) new Function(`return (async()=>{${match[1]}})`);
            }
            console.log(`${file} OK`);
          }
          NODE
