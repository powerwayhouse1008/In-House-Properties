<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Powerway CMS · New project</title><style>:root{--navy:#102d45;--blue:#78c9ea;--sky:#eaf7fc;--line:#d5e8f0;--muted:#607d90}*{box-sizing:border-box}body{margin:0;background:#f4fbff;color:#163047;font-family:Arial,sans-serif}.top{background:var(--navy);color:#fff;padding:18px 28px;display:flex;justify-content:space-between}.wrap{max-width:1120px;margin:32px auto;padding:0 22px}.back{color:#218bb8;text-decoration:none;font-size:13px}.title{font:400 40px Georgia,serif;color:var(--navy);margin:18px 0 28px}.panel{background:#fff;border:1px solid var(--line);padding:24px;margin-bottom:18px;box-shadow:0 10px 28px rgba(30,110,145,.06)}.panel h2{font:400 24px Georgia,serif;color:var(--navy);margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:grid;gap:6px;font-size:12px;color:var(--muted)}input,select,textarea{border:1px solid var(--line);padding:12px;border-radius:4px;font:inherit;color:#163047;background:#fbfeff}textarea{min-height:100px}.full{grid-column:1/-1}.uploads{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.upload{border:1px dashed #9ec8db;padding:18px;background:#f8fdff}.upload input{width:100%;padding:8px 0;border:0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:12px 18px;background:var(--blue);color:var(--navy);font-weight:700;cursor:pointer;text-decoration:none}.btn.dark{background:var(--navy);color:#fff}.status{padding:10px;background:#eef8fc;color:#2187b7;border-radius:4px;font-size:13px}@media(max-width:680px){.grid,.uploads{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header class="top"><strong>POWERWAY CMS</strong><a class="back" href="admin.html">← Dashboard</a></header><main class="wrap"><h1 class="title">Tạo dự án / đăng căn hộ</h1><form id="projectForm"><section class="panel"><h2>Thông tin dự án</h2><div class="grid"><label>Tên dự án (VI)<input required name="projectVi" placeholder="The Toyomi Tower"></label><label>Project name (EN)<input name="projectEn" placeholder="The Toyomi Tower Marine & Sky"></label><label>プロジェクト名 (JA)<input name="projectJa"></label><label>프로젝트명 (KO)<input name="projectKo"></label><label>项目名称 (ZH)<input name="projectZh"></label><label>Mã định danh / slug<input required name="slug" placeholder="the-toyomi-tower"></label><label>Địa chỉ<input name="address"></label><label>Ga gần nhất<input name="station" placeholder="Kachidoki Station"></label><label>Số phút đi bộ<input type="number" name="walking" value="10"></label><label>Số tầng<input type="number" name="floors" value="53"></label><label>Tổng số căn<input type="number" name="totalUnits" value="2046"></label><label>Ngày hoàn thành<input type="month" name="completion"></label><label class="full">Mô tả dự án<textarea name="projectDescription"></textarea></label></div></section><section class="panel"><h2>Thông tin căn hộ</h2><div class="grid"><label>Mã căn<input required name="unit" value="E5209"></label><label>Trạng thái<select name="status"><option value="draft">Draft · Bản nháp</option><option value="pending">Pending · Chờ duyệt</option><option value="published">Published · Đang bán</option><option value="reserved">Reserved · Đã giữ chỗ</option><option value="sold">Sold · Đã bán</option><option value="hidden">Hidden · Tạm ẩn</option></select></label><label>Tầng<input name="floor" value="52F"></label><label>Diện tích<input name="size" value="126.26㎡"></label><label>Hướng<input name="direction" value="South"></label><label>Loại căn<input name="layout" value="2LDK + WIC + SIC"></label><label>Giá bán (JPY)<input type="number" name="price" value="565000000"></label><label>Phí quản lý / tháng<input name="managementFee"></label><label>Quỹ sửa chữa / tháng<input name="repairFee"></label><label>Tình trạng pháp lý<input name="legalStatus" value="Ownership / Freehold"></label><label>Ngày cập nhật<input type="date" name="updatedAt"></label><label class="full">Mô tả nổi bật<textarea name="unitDescription"></textarea></label></div></section><section class="panel"><h2>Ảnh, video và tài liệu</h2><div class="uploads"><label class="upload">Ảnh đại diện<input type="file" accept="image/*" name="cover"></label><label class="upload">Album ảnh<input type="file" accept="image/*" multiple name="gallery"></label><label class="upload">Ảnh mặt bằng<input type="file" accept="image/*,.pdf" name="floorplan"></label><label class="upload">Video giới thiệu<input type="file" accept="video/mp4,video/webm" name="videoIntro"></label><label class="upload">Video view ban công<input type="file" accept="video/mp4,video/webm" name="videoView"></label><label class="upload">PDF bán hàng<input type="file" accept="application/pdf" multiple name="pdfs"></label></div><p class="status">Hệ thống sẽ kiểm tra định dạng, dung lượng và tạo ảnh poster trước khi xuất bản.</p></section><section class="panel"><h2>Xuất bản</h2><div class="actions"><button class="btn" type="button" id="draft">Lưu bản nháp</button><button class="btn dark" type="submit">Gửi duyệt / xuất bản</button><a class="btn" href="residence-detail.html?unit=E5209" target="_blank">Xem trước</a></div><p id="notice" class="status" hidden></p></section></form></main><script>const form=document.getElementById('projectForm'),notice=document.getElementById('notice');function save(status){const data=Object.fromEntries(new FormData(form).entries());data.status=status;data.savedAt=new Date().toISOString();localStorage.setItem('powerway-project-draft',JSON.stringify(data));notice.hidden=false;notice.textContent=status==='draft'?'Đã lưu bản nháp.':'Đã gửi dự án vào hàng chờ duyệt.';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}document.getElementById('draft').onclick=()=>save('draft');form.onsubmit=e=>{e.preventDefault();save('pending')};</script></body></html>
