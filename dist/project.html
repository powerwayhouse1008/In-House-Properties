<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Powerway · Residence</title><style>
:root{--ink:#20242a;--muted:#73777c;--cream:#f3f0e8;--dark:#090d11;--gold:#c6a45b;--line:#ded9ce}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font:16px/1.7 Arial,sans-serif}.nav{position:fixed;z-index:5;top:0;left:0;right:0;height:58px;padding:11px 3vw;background:#090c0fe8;color:#fff;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em}.nav strong{font-size:13px}.nav span{color:#e7d39a}.wrap{width:min(1120px,calc(100% - 44px));margin:auto}.hero{min-height:100vh;position:relative;background:#101820;color:#fff;display:grid;align-items:end;overflow:hidden}.hero-bg{position:absolute;inset:0;background:#1b2c35}.hero-bg img,.hero-bg video{width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0003 20%,#000b 90%)}.hero-content{position:relative;z-index:1;padding:0 0 95px}.ey{color:var(--gold);font-size:11px;letter-spacing:.3em;text-transform:uppercase}.hero h1{font:400 clamp(52px,9vw,126px)/.95 Georgia,serif;margin:16px 0}.hero h2{font-weight:400;font-size:clamp(18px,3vw,32px);margin:0 0 15px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #ffffff80;border-radius:20px;padding:6px 12px;font-size:12px}.price{color:#f0d58e;font-size:clamp(28px,5vw,58px);font-weight:bold;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(6,1fr);background:var(--dark);color:#fff}.stat{padding:24px 16px;text-align:center;border-right:1px solid #ffffff1c}.stat b{display:block;font:34px Georgia,serif}.stat small{color:#b7a16d;letter-spacing:.2em;font-size:10px}.section{padding:120px 0;background:var(--cream)}.section.dark{background:var(--dark);color:#fff}.intro{max-width:800px}.section h2{font:400 clamp(34px,5vw,68px)/1.15 Georgia,serif;margin:14px 0 22px}.copy{max-width:720px;color:var(--muted)}.dark .copy{color:#aeb5b7}.split{display:grid;grid-template-columns:1fr 1fr;gap:65px;align-items:center}.media{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.media figure{margin:0;background:#fff}.media img,.media video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.media figcaption{padding:10px 12px;color:var(--muted);font-size:12px}.feature{margin-top:36px}.feature img,.feature video{width:100%;max-height:670px;object-fit:cover;display:block}.table{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:30px}.table div{padding:14px;border-bottom:1px solid var(--line)}.table div:nth-child(odd){font-weight:bold;color:#76633a;background:#eee9df}.unit-nav{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0}.unit-nav a,.btn{display:inline-block;padding:10px 15px;border:1px solid #bda66c;border-radius:22px;color:inherit;text-decoration:none;font-size:13px}.btn{background:var(--gold);color:#111;border:0;font-weight:bold}.foot{padding:28px;background:#080b0d;color:#aaa;text-align:center;font-size:12px}@media(max-width:760px){.stats{grid-template-columns:repeat(3,1fr)}.stat b{font-size:23px}.split{grid-template-columns:1fr;gap:30px}.section{padding:76px 0}.media{grid-template-columns:1fr}.hero-content{padding-bottom:55px}.nav{font-size:10px}.nav span{display:none}}
</style></head><body><header class="nav"><strong id="navName">POWERWAY</strong><span id="navPrice"></span><span>JA　EN　中文</span></header><main id="app"></main><footer class="foot">© 2026 POWERWAY · Property information is subject to change.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const q=new URLSearchParams(location.search),slug=q.get('project')||'toyomi',unitCode=q.get('unit')||'E5209',fallback={name:'The Toyomi Tower',location:'TOKYO · TOYOMI',description:'Tokyo Bay front-row living',scale:'53 floors · 2,046 homes',media:{},homes:[{code:'E5209',title:'East Wing · South',layout:'2LDK',size:'126.26㎡',floor:'52F',direction:'South',price:'¥565,000,000',media:[]},{code:'W4416',title:'West Wing · Southwest',layout:'2LDK',size:'106.82㎡',floor:'44F',direction:'Southwest',price:'¥395,000,000',media:[]} ]};let project=fallback,home=fallback.homes.find(x=>x.code===unitCode)||fallback.homes[0];const cfg=window.POWERWAY_SUPABASE_CONFIG||JSON.parse(localStorage.getItem('powerway-supabase-config')||'null')||{};const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=x=>Array.isArray(x)?x.filter(m=>m&&m.url):[];const card=m=>m.type?.startsWith('video/')?'<figure><video src="'+m.url+'" muted autoplay loop playsinline webkit-playsinline controls></video><figcaption>Video</figcaption></figure>':'<figure><img loading="lazy" src="'+m.url+'" alt="Residence media"><figcaption>Residence media</figcaption></figure>';function media(items,limit=99){return arr(items).slice(0,limit).map(card).join('')||'<p class="copy">Media đang được cập nhật.</p>'}function render(){const pm=project.media||{},hm=home.media||[],all=arr(hm),images=all.filter(m=>m.type?.startsWith('image/')),videos=all.filter(m=>m.type?.startsWith('video/')),cover=arr(pm.cover)[0]||images[0],gallery=arr(pm.gallery),hero=cover?.url||'';document.title=project.name+' · '+home.title;navName.textContent=project.name.toUpperCase()+' · '+home.code;navPrice.textContent=home.price||'';app.innerHTML='<section class="hero"><div class="hero-bg">'+(cover?.type?.startsWith('video/')?'<video src="'+hero+'" muted autoplay loop playsinline webkit-playsinline></video>':'<img src="'+hero+'" alt="Project hero">')+'</div><div class="wrap hero-content"><div class="ey">'+esc(project.name)+' — '+esc(home.code)+'</div><h1>'+esc(home.title)+'</h1><h2>'+esc(home.text||project.description||'Tokyo Bay front-row living')+'</h2><div class="chips"><span class="chip">'+esc(home.floor||'—')+'</span><span class="chip">'+esc(home.direction||'—')+'</span><span class="chip">'+esc(home.layout||'—')+'</span><span class="chip">'+esc(home.size||'—')+'</span><span class="chip">'+esc(project.scale||'—')+'</span></div><div class="price">'+esc(home.price||'お問い合わせください')+'</div></div></section><section class="stats">'+[[''+(home.floor||'—'),'FLOOR'],[''+(home.size||'—'),'AREA'],[''+(home.layout||'—'),'PLAN'],[''+(home.direction||'—'),'DIRECTION'],[''+(project.scale||'—'),'SCALE'],[''+(home.station||'—'),'ACCESS']].map(x=>'<div class="stat"><b>'+esc(x[0])+'</b><small>'+x[1]+'</small></div>').join('')+'</section><section class="section"><div class="wrap intro"><div class="ey">01 — FLOOR PLAN</div><h2>'+esc(home.title)+' — một căn hộ có câu chuyện riêng</h2><p class="copy">'+esc(home.text||project.description||'Mặt bằng, tầm nhìn và các không gian sống được trình bày theo từng căn hộ.')+'</p><div class="feature">'+media(images,1)+'</div><div class="unit-nav">'+(project.homes||[]).map(h=>'<a href="project.html?project='+encodeURIComponent(slug)+'&unit='+encodeURIComponent(h.code)+'">'+esc(h.code)+' · '+esc(h.title)+'</a>').join('')+'</div></div></section><section class="section dark"><div class="wrap split"><div><div class="ey">02 — VIEW</div><h2>Tokyo Bay, một tầm nhìn mở</h2><p class="copy">Hình ảnh và video được đồng bộ theo đúng căn hộ đã lưu trên Supabase.</p></div><div class="media">'+media(images.slice(1,5))+'</div></div></section><section class="section"><div class="wrap"><div class="ey">03 — LIVING & DINING</div><h2>Ánh sáng, vật liệu và khoảng mở</h2><div class="feature">'+media(images.slice(5,6))+'</div><div class="media">'+media(images.slice(6,10))+'</div></div></section><section class="section"><div class="wrap"><div class="ey">04 — BEDROOMS</div><h2>Không gian riêng tư cho từng nhịp sống</h2><div class="media">'+media(images.slice(10,16))+'</div></div></section><section class="section dark"><div class="wrap split"><div><div class="ey">05 — MOVIE</div><h2>Chuyển động của không gian</h2><p class="copy">Video tự phát, lặp lại và hỗ trợ phát trên điện thoại.</p></div><div class="media">'+media(videos.concat(arr(pm.projectVideo)))+'</div></div></section><section class="section"><div class="wrap"><div class="ey">06 — COMMON SPACE</div><h2>Tiện ích và trải nghiệm sống</h2><div class="media">'+media(gallery.slice(0,8))+'</div></div></section><section class="section dark"><div class="wrap"><div class="ey">07 — LOCATION / 08 — ACCESS</div><h2>'+esc(project.location||'Tokyo')+'</h2><p class="copy">'+esc(home.access||home.station||'Kết nối thuận tiện đến các ga và tiện ích xung quanh.')+'</p><div class="media">'+media(gallery.slice(8,12))+'</div></div></section><section class="section"><div class="wrap"><div class="ey">09 — EQUIPMENT</div><h2>Thiết bị ·仕様</h2><div class="table">'+[['Project',project.name],['Residence',home.title],['Layout',home.layout],['Area',home.size],['Floor',home.floor],['Direction',home.direction],['Price',home.price],['Status',home.status||'Published']].map(x=>'<div>'+esc(x[0])+'</div><div>'+esc(x[1])+'</div>').join('')+'</div></div></section><section class="section"><div class="wrap"><div class="ey">10 — OUTLINE</div><h2>Property outline</h2><p class="copy">Thông tin được lấy từ dữ liệu dự án và căn hộ đã lưu chính thức.</p><a class="btn" href="index.html">Quay lại danh sách dự án</a></div></section>'}async function load(){if(cfg.url&&cfg.publishableKey){const c=window.supabase.createClient(cfg.url,cfg.publishableKey),r=await c.from('cms_projects').select('data').eq('slug',slug).maybeSingle();if(r.data?.data){project=r.data.data;home=(project.homes||[]).find(h=>h.code===unitCode)||project.homes?.[0]||home}}const local=JSON.parse(localStorage.getItem('powerway-project-data')||'null');if(local?.slug===slug){project={...project,...local};home=(local.homes||[]).find(h=>h.code===unitCode)||home}render()}load().catch(render);
</script></body></html>
