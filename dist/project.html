<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Powerway · Residence</title><style>:root{--dark:#090d11;--cream:#f3f0e8;--gold:#c6a45b;--line:#ddd7ca}*{box-sizing:border-box}body{margin:0;font:15px/1.7 Arial;color:#20242a}.nav{position:fixed;z-index:4;top:0;left:0;right:0;padding:15px 4%;background:#090d11e8;color:#fff;display:flex;justify-content:space-between}.hero{min-height:92vh;background:#15242a;color:#fff;position:relative;display:grid;align-items:end;overflow:hidden}.hero img,.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent,#000c)}.hero .in{position:relative;z-index:1;padding:0 6% 80px}.ey{color:var(--gold);letter-spacing:.25em;font-size:11px}.hero h1{font:clamp(48px,9vw,120px)/1 Georgia,serif;margin:12px 0}.price{color:#f0d58e;font-size:42px;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(6,1fr);background:var(--dark);color:#fff}.stat{padding:22px;text-align:center;border-right:1px solid #fff2}.stat b{display:block;font:28px Georgia}.stat small{color:#c8ae6f}.section{padding:100px 6%;background:var(--cream)}.dark{background:var(--dark);color:#fff}.section h2{font:42px Georgia;margin:12px 0 22px}.copy{max-width:700px;color:#72787b}.table{max-width:1000px;display:grid;grid-template-columns:230px 1fr;border-top:1px solid var(--line);margin-top:28px}.table div{padding:12px;border-bottom:1px solid var(--line)}.table div:nth-child(odd){background:#e9e4d9;font-weight:bold;color:#75623b}.media{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.media figure{margin:0;background:#fff}.media img,.media video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.media figcaption{padding:9px;color:#73777c;font-size:12px}.feature img,.feature video{width:100%;max-height:640px;object-fit:cover}.btn{display:inline-block;margin-top:25px;padding:11px 16px;background:var(--gold);color:#111;text-decoration:none;border-radius:22px}@media(max-width:750px){.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:14px 8px}.media{grid-template-columns:1fr}.section{padding:70px 5%}.table{grid-template-columns:1fr}.table div:nth-child(odd){border-bottom:0}}
</style></head><body><header class="nav"><b id="nav"></b><span id="price"></span></header><main id="app"></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const q=new URLSearchParams(location.search),slug=q.get('project')||'toyomi',code=q.get('unit')||'E5209';let cfg=JSON.parse(localStorage.getItem('powerway-supabase-config')||'null')||{},p={name:'The Toyomi Tower',location:'Tokyo · Toyomi',scale:'53 floors · 2,046 homes',description:'Tokyo Bay front-row living',media:{},homes:[{code:'E5209',title:'East Wing · South',price:'¥565,000,000',layout:'2LDK',area:'126.26㎡',media:[]}]},h=p.homes[0];const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const list=a=>(a||[]).filter(x=>x?.url).sort((a,b)=>(b.featured-a.featured)||(b.score||0)-(a.score||0)||(a.order||0)-(b.order||0));function card(m){return '<figure>'+(m.type?.startsWith('video/')?'<video src="'+m.url+'" muted autoplay loop playsinline webkit-playsinline controls></video>':'<img loading="lazy" src="'+m.url+'" alt="'+esc(m.caption||'Residence media')+'">')+'<figcaption>'+esc(m.caption||'')+'</figcaption></figure>'}function render(){const pm=p.media||{},hm=list(h.media),imgs=hm.filter(x=>x.type?.startsWith('image/')),vids=hm.filter(x=>x.type?.startsWith('video/')),cover=list(pm.cover)[0]||imgs[0],all=imgs.concat(vids),fields=[['物件名',h.title||h.code],['販売価格',h.price],['所在地',h.address||p.location],['交通',h.transport||h.station],['所在階 / 向き',h.floorDirection||h.floor+' · '+h.direction],['間取り',h.layout],['専有面積',h.area||h.size],['バルコニー',h.balcony],['トランクルーム',h.trunkRoom],['天井高',h.ceilingHeight],['眺望',h.view],['駐車場',h.parking],['構造・規模',h.structure||p.scale],['総戸数',h.totalHomes],['竣工',h.completion],['管理費',h.managementFee],['修繕積立金',h.repairReserve],['その他使用料',h.otherFees],['敷地の権利',h.landRights],['用途地域',h.zoning],['管理',h.management]];nav.textContent=(p.name||'').toUpperCase()+' · '+(h.code||'');price.textContent=h.price||'';app.innerHTML='<section class="hero">'+(cover?.type?.startsWith('video/')?'<video src="'+cover.url+'" muted autoplay loop playsinline webkit-playsinline></video>':'<img src="'+(cover?.url||'')+'" alt="Residence cover">')+'<div class="in"><div class="ey">'+esc(p.name)+' — '+esc(h.code)+'</div><h1>'+esc(h.title||h.code)+'</h1><p>'+esc(h.text||p.description)+'</p><div class="price">'+esc(h.price||'お問い合わせください')+'</div></div></section><section class="stats">'+[[''+(h.floor||'—'),'FLOOR'],[''+(h.area||h.size||'—'),'AREA'],[''+(h.layout||'—'),'PLAN'],[''+(h.direction||'—'),'DIRECTION'],[''+(p.scale||'—'),'SCALE'],[''+(h.transport||'—'),'ACCESS']].map(x=>'<div class="stat"><b>'+esc(x[0])+'</b><small>'+x[1]+'</small></div>').join('')+'</section><section class="section"><div class="ey">01 — FLOOR PLAN / OUTLINE</div><h2>'+esc(h.title||'Residence information')+'</h2><p class="copy">'+esc(h.text||p.description)+'</p><div class="table">'+fields.map(x=>'<div>'+esc(x[0])+'</div><div>'+esc(x[1]||'—')+'</div>').join('')+'</div></section><section class="section dark"><div class="ey">02 — VIEW / LIVING</div><h2>Không gian và tầm nhìn</h2><div class="media">'+all.slice(0,8).map(card).join('')+'</div></section><section class="section"><div class="ey">03 — MOVIE / GALLERY</div><h2>Media của căn hộ</h2><div class="media">'+list(vids.concat(pm.projectVideo,pm.gallery)).map(card).join('')+'</div><a class="btn" href="index.html">Quay lại danh sách dự án</a></section>'}async function load(){const remote=await fetch('/api/supabase-config').then(r=>r.ok?r.json():{}).catch(()=>({}));cfg={...cfg,...remote};if(cfg.url&&cfg.publishableKey){const c=window.supabase.createClient(cfg.url,cfg.publishableKey),r=await c.from('cms_projects').select('data').eq('slug',slug).maybeSingle();if(r.data?.data){p=r.data.data;h=(p.homes||[]).find(x=>x.code===code)||p.homes?.[0]||h}}render()}load().catch(render);
</script></body></html>
