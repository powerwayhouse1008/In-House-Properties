<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Powerway CMS · Editor</title><style>
:root{--ink:#10242a;--paper:#fffdf8;--bg:#f3efe7;--gold:#b47c52;--line:#d9d3c8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial}.top{background:var(--ink);color:#fff;padding:16px}.wrap{max-width:1100px;margin:auto;padding:0 24px}.top .wrap{display:flex;justify-content:space-between;align-items:center}.btn{background:var(--ink);color:#fff;border:0;border-radius:4px;padding:11px 16px;cursor:pointer}.gold{background:var(--gold);color:#111}.panel{background:var(--paper);border:1px solid var(--line);padding:22px;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:grid;gap:6px;color:#68777a;font-size:13px}input,textarea{padding:10px;border:1px solid var(--line);font:inherit;background:#fff}textarea{min-height:78px}.full{grid-column:1/-1}.media-row{border-top:1px solid var(--line);padding:15px 0;display:grid;grid-template-columns:120px 1fr 150px;gap:14px;align-items:start}.media-row img,.media-row video{width:120px;height:84px;object-fit:cover;background:#152328}.media-row textarea{min-height:60px}.home{border-top:1px solid var(--line);padding:18px 0}.media-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.notice{color:#175d4d;font-weight:bold}.error{color:#a21f1f}.muted{color:#68777a}@media(max-width:700px){.grid,.media-list{grid-template-columns:1fr}.full{grid-column:auto}.media-row{grid-template-columns:90px 1fr}.media-row img,.media-row video{width:90px;height:70px}.media-row>label:last-child{grid-column:2}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="wrap"><strong>POWERWAY · CMS</strong><a class="btn" href="admin-v3.html">Quay lại</a></div></header><main class="wrap"><section class="panel"><h1>Tạo / sửa dự án</h1><div class="grid"><label>Tên dự án<input id="name" value="The Toyomi Tower"></label><label>Slug<input id="slug" value="toyomi"></label><label>Khu vực<input id="location" value="Tokyo · Toyomi"></label><label>Quy mô<input id="scale" value="53 floors · 2,046 homes"></label><label class="full">Mô tả<textarea id="description"></textarea></label><label>Ảnh/video bìa<input id="coverFile" type="file" accept="image/*,video/*"></label><label>Video dự án<input id="videoFile" type="file" accept="video/*"></label><label class="full">Gallery ảnh/video<input id="galleryFile" type="file" accept="image/*,video/*" multiple></label></div></section><section class="panel"><h2>Media dự án</h2><p class="muted">Mỗi ảnh/video có giải thích, điểm nổi bật và lựa chọn làm media ưu tiên. Media đầu tiên được dùng làm cover nếu chưa chọn khác.</p><div id="projectMedia"></div></section><section class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>Các căn hộ</h2><button class="btn gold" id="addHome">＋ Thêm căn</button></div><div id="homes"></div></section><section class="panel"><button class="btn gold" id="save">Lưu chính thức lên Supabase</button> <span id="notice"></span></section></main><script>
let cfg=JSON.parse(localStorage.getItem('powerway-supabase-config')||'null')||{},client,bucket='project-media',data={name:'The Toyomi Tower',slug:'toyomi',location:'Tokyo · Toyomi',scale:'53 floors · 2,046 homes',description:'',status:'Published',media:{cover:[],projectVideo:[],gallery:[]},homes:[{code:'E5209',title:'East Wing · South',layout:'2LDK',size:'126.26㎡',floor:'52F',direction:'South',price:'¥565,000,000',media:[]}]};
const $=id=>document.getElementById(id),esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function all(){return [...data.media.cover,...data.media.projectVideo,...data.media.gallery,...data.homes.flatMap(h=>h.media||[])]}function row(m,scope,index){return '<div class="media-row" data-scope="'+scope+'" data-index="'+index+'">'+(m.type?.startsWith('video/')?'<video src="'+m.url+'" muted controls loop playsinline></video>':'<img src="'+m.url+'" alt="media">')+'<label>Giải thích<textarea class="caption">'+esc(m.caption||'')+'</textarea></label><label><span><input class="featured" type="checkbox" '+(m.featured?'checked':'')+'> Nổi bật</span><span>Điểm 0–100<input class="score" type="number" min="0" max="100" value="'+(m.score||0)+'"></span><button type="button" class="btn remove">Xóa</button></label></div>'}function draw(){projectMedia.innerHTML=all().map((m,i)=>row(m,'project',i)).join('')||'<p class="muted">Chưa có media.</p>';homes.innerHTML=data.homes.map((h,hi)=>'<article class="home"><div class="grid"><label>Mã căn<input data-h="'+hi+'" data-k="code" value="'+esc(h.code)+'"></label><label>Tên căn<input data-h="'+hi+'" data-k="title" value="'+esc(h.title)+'"></label><label>Layout<input data-h="'+hi+'" data-k="layout" value="'+esc(h.layout)+'"></label><label>Diện tích<input data-h="'+hi+'" data-k="size" value="'+esc(h.size)+'"></label><label>Tầng<input data-h="'+hi+'" data-k="floor" value="'+esc(h.floor)+'"></label><label>Giá<input data-h="'+hi+'" data-k="price" value="'+esc(h.price)+'"></label><label class="full">Mô tả căn<textarea data-h="'+hi+'" data-k="text">'+esc(h.text)+'</textarea></label><label class="full">Upload ảnh/video căn<input data-hfile="'+hi+'" type="file" accept="image/*,video/*" multiple></label></div><div class="media-list">'+(h.media||[]).map((m,i)=>row(m,'home-'+hi,i)).join('')+'</div></article>').join('')}async function setup(){const remote=await fetch('/api/supabase-config').then(r=>r.ok?r.json():{}).catch(()=>({}));cfg={...cfg,...remote};if(cfg.url&&cfg.publishableKey)client=window.supabase.createClient(cfg.url,cfg.publishableKey);const key=new URLSearchParams(location.search).get('project')||$('slug').value;if(client&&key){const r=await client.from('cms_projects').select('data').eq('slug',key).maybeSingle();if(r.data?.data)data={...data,...r.data.data,media:{...data.media,...(r.data.data.media||{})}}}name.value=data.name;slug.value=data.slug;location.value=data.location;scale.value=data.scale;description.value=data.description;draw()}async function upload(file,folder){if(!client)throw Error('Chưa cấu hình Supabase URL và publishable key.');const path=folder+'/'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'-');const r=await client.storage.from(bucket).upload(path,file,{upsert:false,contentType:file.type});if(r.error)throw r.error;return{path,url:client.storage.from(bucket).getPublicUrl(path).data.publicUrl,type:file.type,name:file.name,score:0,featured:false}}async function files(input,folder){return Promise.all([...input.files].map(f=>upload(f,folder)))}function sync(){data.name=name.value;data.slug=slug.value;data.location=location.value;data.scale=scale.value;data.description=description.value;document.querySelectorAll('.media-row').forEach(el=>{const scope=el.dataset.scope,i=+el.dataset.index,m=scope==='project'?all()[i]:data.homes[+scope.split('-')[1]].media[i];if(!m)return;m.caption=el.querySelector('.caption').value;m.featured=el.querySelector('.featured').checked;m.score=Math.max(0,Math.min(100,+el.querySelector('.score').value||0));m.order=i})}async function save(){sync();if(!client){notice.textContent='Thiếu Supabase URL hoặc publishable key';notice.className='error';return}const r=await client.from('cms_projects').upsert({slug:data.slug,data:{...data,status:'Published',updatedAt:new Date().toISOString()},updated_at:new Date().toISOString()},{onConflict:'slug'}).select('slug').maybeSingle();if(r.error||!r.data){notice.textContent=r.error?.message||'Lưu thất bại';notice.className='error';return}localStorage.setItem('powerway-project-data',JSON.stringify(data));notice.textContent='Đã lưu chính thức lên Supabase';notice.className='notice'}$('addHome').onclick=()=>{data.homes.push({code:'NEW-'+(data.homes.length+1),title:'Căn hộ mới',media:[]});draw()};$('save').onclick=save;document.addEventListener('input',e=>{if(e.target.dataset.h){data.homes[+e.target.dataset.h][e.target.dataset.k]=e.target.value}});document.addEventListener('change',async e=>{try{if(e.target.id==='coverFile'){const x=await files(e.target,'projects/'+slug.value);data.media.cover=x;draw()}if(e.target.id==='videoFile'){const x=await files(e.target,'projects/'+slug.value);data.media.projectVideo=x;draw()}if(e.target.id==='galleryFile'){const x=await files(e.target,'projects/'+slug.value);data.media.gallery.push(...x);draw()}if(e.target.dataset.hfile){const i=+e.target.dataset.hfile;const x=await files(e.target,'projects/'+slug.value+'/'+data.homes[i].code);data.homes[i].media.push(...x);draw()}}catch(err){notice.textContent='Upload thất bại: '+err.message;notice.className='error'}});document.addEventListener('click',async e=>{if(!e.target.classList.contains('remove'))return;const el=e.target.closest('.media-row'),scope=el.dataset.scope,i=+el.dataset.index,m=scope==='project'?all()[i]:data.homes[+scope.split('-')[1]].media[i];if(m?.path&&client)await client.storage.from(bucket).remove([m.path]);if(scope==='project'){for(const k of ['cover','projectVideo','gallery'])data.media[k]=data.media[k].filter(x=>x!==m)}else data.homes[+scope.split('-')[1]].media.splice(i,1);draw()});setup();
</script></body></html>
