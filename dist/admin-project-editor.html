<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Powerway CMS</title><style>:root{--i:#10242a;--p:#fffdf8;--b:#f3efe7;--l:#d9d3c8;--g:#b47c52}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font:14px Arial}.top{background:var(--i);color:#fff;padding:16px}.wrap{max-width:1120px;margin:auto;padding:0 22px}.top .wrap{display:flex;justify-content:space-between}.btn{background:var(--i);color:#fff;border:0;padding:11px 16px;border-radius:4px}.gold{background:var(--g);color:#111}.panel{background:var(--p);border:1px solid var(--l);padding:22px;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:grid;gap:5px;color:#68777a;font-size:12px}input,textarea{padding:10px;border:1px solid var(--l);font:inherit}textarea{min-height:65px}.full{grid-column:1/-1}.home{border-top:1px solid var(--l);padding:18px 0}.media{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.media figure{margin:0;border:1px solid var(--l);padding:7px}.media img,.media video{width:100%;height:110px;object-fit:cover}.media figcaption{font-size:11px;color:#68777a}.notice{color:#17634e;font-weight:bold}.error{color:#a21f1f}@media(max-width:700px){.grid,.media{grid-template-columns:1fr}.full{grid-column:auto}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="wrap"><strong>POWERWAY · CMS</strong><a class="btn" href="admin-v3.html">Quay lại</a></div></header><main class="wrap"><section class="panel"><h1>Tạo / sửa dự án</h1><div class="grid"><label>Tên dự án<input id="name"></label><label>Slug<input id="slug"></label><label>Khu vực<input id="location"></label><label>Quy mô<input id="scale"></label><label class="full">Mô tả<textarea id="description"></textarea></label><label>Ảnh/video bìa<input id="cover" type="file" accept="image/*,video/*"></label><label>Video dự án<input id="projectVideo" type="file" accept="video/*"></label><label class="full">Gallery<input id="gallery" type="file" accept="image/*,video/*" multiple></label></div></section><section class="panel"><div style="display:flex;justify-content:space-between"><h2>Thông tin từng căn hộ</h2><button id="add" class="btn gold">＋ Thêm căn</button></div><div id="homes"></div></section><section class="panel"><button id="save" class="btn gold">Lưu chính thức lên Supabase</button> <span id="notice"></span></section></main><script>
const F=[['title','Tên căn'],['code','Mã căn'],['address','Địa chỉ'],['price','Giá bán'],['transport','Giao thông'],['floorDirection','Tầng / hướng'],['layout','間取り / Layout'],['area','Diện tích riêng'],['balcony','Ban công'],['trunkRoom','Phòng kho'],['ceilingHeight','Chiều cao trần'],['view','Tầm nhìn'],['parking','Bãi đỗ xe'],['structure','Kết cấu · quy mô'],['totalHomes','Tổng số căn'],['completion','Thời gian hoàn thiện'],['managementFee','Phí quản lý'],['repairReserve','Phí sửa chữa'],['otherFees','Phí khác'],['landRights','Quyền sử dụng đất'],['zoning','Khu vực quy hoạch'],['management','Đơn vị quản lý'],['text','Mô tả căn']];let cfg=JSON.parse(localStorage.getItem('powerway-supabase-config')||'null')||{},client,bucket='project-media',data={name:'The Toyomi Tower',slug:'toyomi',location:'Tokyo · Toyomi',scale:'53 floors · 2,046 homes',description:'',status:'Published',media:{cover:[],projectVideo:[],gallery:[]},homes:[{code:'E5209',title:'East Wing · South',layout:'2LDK',area:'126.26㎡',price:'¥565,000,000',media:[]}]};const $=id=>document.getElementById(id),esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function homeForm(h,i){return '<article class="home"><div class="grid">'+F.map(([k,l])=>'<label>'+l+((k==='text')?'<textarea data-h="'+i+'" data-k="'+k+'">'+esc(h[k])+'</textarea>':'<input data-h="'+i+'" data-k="'+k+'" value="'+esc(h[k])+'">')+'</label>').join('')+'<label>Ảnh/video căn<input data-file="'+i+'" type="file" accept="image/*,video/*" multiple></label></div><div class="media">'+(h.media||[]).map((m,j)=>'<figure>'+(m.type?.startsWith('video/')?'<video src="'+m.url+'" controls muted loop playsinline></video>':'<img src="'+m.url+'">')+'<figcaption><input data-m="'+i+'-'+j+'" placeholder="Giải thích ảnh" value="'+esc(m.caption)+'"><label><input type="checkbox" data-f="'+i+'-'+j+'" '+(m.featured?'checked':'')+'> Nổi bật · điểm <input type="number" min="0" max="100" data-s="'+i+'-'+j+'" value="'+(m.score||0)+'"></label><button class="btn remove" data-r="'+i+'-'+j+'">Xóa</button></figcaption></figure>').join('')+'</div></article>'}function draw(){homes.innerHTML=data.homes.map(homeForm).join('')}function sync(){data.name=name.value;data.slug=slug.value;data.location=location.value;data.scale=scale.value;data.description=description.value;document.querySelectorAll('[data-h]').forEach(e=>data.homes[+e.dataset.h][e.dataset.k]=e.value);data.homes.forEach((h,i)=>(h.media||[]).forEach((m,j)=>{m.caption=document.querySelector('[data-m="'+i+'-'+j+'"]')?.value||m.caption;m.featured=!!document.querySelector('[data-f="'+i+'-'+j+'"]')?.checked;m.score=+(document.querySelector('[data-s="'+i+'-'+j+'"]')?.value||0)}))}async function upload(file,folder){if(!client)throw Error('Chưa cấu hình Supabase URL và publishable key.');const path=folder+'/'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'-'),r=await client.storage.from(bucket).upload(path,file,{upsert:false,contentType:file.type});if(r.error)throw r.error;return{path,url:client.storage.from(bucket).getPublicUrl(path).data.publicUrl,type:file.type,name:file.name,score:0,featured:false}}async function uploadList(input,folder){return Promise.all([...input.files].map(f=>upload(f,folder)))}async function save(){sync();if(!client){notice.textContent='Thiếu Supabase URL hoặc publishable key';notice.className='error';return}const now=new Date().toISOString(),r=await client.from('cms_projects').upsert({slug:data.slug,data:{...data,status:'Published',updatedAt:now},updated_at:now},{onConflict:'slug'}).select('slug').maybeSingle();notice.textContent=r.error||!r.data?(r.error?.message||'Lưu thất bại'):'Đã lưu chính thức và đồng bộ toàn bộ thông tin';notice.className=r.error?'error':'notice';localStorage.setItem('powerway-project-data',JSON.stringify(data))}async function load(){const remote=await fetch('/api/supabase-config').then(r=>r.ok?r.json():{}).catch(()=>({}));cfg={...cfg,...remote};if(cfg.url&&cfg.publishableKey)client=window.supabase.createClient(cfg.url,cfg.publishableKey);const key=new URLSearchParams(location.search).get('project')||'toyomi';if(client){const r=await client.from('cms_projects').select('data').eq('slug',key).maybeSingle();if(r.data?.data)data={...data,...r.data.data,media:{...data.media,...(r.data.data.media||{})}}}name.value=data.name;slug.value=data.slug;location.value=data.location;scale.value=data.scale;description.value=data.description;draw()}$('add').onclick=()=>{data.homes.push({code:'NEW-'+(data.homes.length+1),title:'Căn hộ mới',media:[]});draw()};$('save').onclick=save;document.addEventListener('input',e=>{if(e.target.dataset.h)data.homes[+e.target.dataset.h][e.target.dataset.k]=e.target.value});document.addEventListener('change',async e=>{try{let x;if(e.target.id==='cover'){x=await uploadList(e.target,'projects/'+slug.value);data.media.cover=x}if(e.target.id==='projectVideo'){x=await uploadList(e.target,'projects/'+slug.value);data.media.projectVideo=x}if(e.target.id==='gallery'){x=await uploadList(e.target,'projects/'+slug.value);data.media.gallery.push(...x)}if(e.target.dataset.file){const i=+e.target.dataset.file;x=await uploadList(e.target,'projects/'+slug.value+'/'+data.homes[i].code);data.homes[i].media.push(...x)}draw()}catch(err){notice.textContent='Upload thất bại: '+err.message;notice.className='error'}});document.addEventListener('click',async e=>{if(!e.target.dataset.r)return;const [i,j]=e.target.dataset.r.split('-').map(Number),m=data.homes[i].media[j];if(m?.path&&client)await client.storage.from(bucket).remove([m.path]);data.homes[i].media.splice(j,1);draw()});load();
</script></body></html>
