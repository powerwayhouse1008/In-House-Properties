<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Powerway CMS</title><style>:root{--i:#10242a;--p:#fffdf8;--b:#f3efe7;--l:#d9d3c8;--g:#b47c52}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font:14px Arial}.top{background:var(--i);color:#fff;padding:14px}.wrap{max-width:1120px;margin:auto;padding:0 22px}.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:15px}.langs{display:flex;gap:4px}.langs button{background:transparent;color:#fff;border:1px solid #fff;padding:7px 10px}.langs button.active{background:#d5ad68;color:#111}.btn{background:var(--i);color:#fff;border:0;padding:11px 16px;border-radius:4px}.gold{background:var(--g);color:#111}.panel{background:var(--p);border:1px solid var(--l);padding:22px;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:grid;gap:5px;color:#68777a;font-size:12px}input,textarea{padding:10px;border:1px solid var(--l);font:inherit}textarea{min-height:65px}.full{grid-column:1/-1}.home{border-top:1px solid var(--l);padding:18px 0}.media{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.media figure{margin:0;border:1px solid var(--l);padding:7px}.media img,.media video{width:100%;height:110px;object-fit:cover}@media(max-width:700px){.grid,.media{grid-template-columns:1fr}.full{grid-column:auto}.top .wrap{flex-wrap:wrap}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="wrap"><strong>POWERWAY · CMS</strong><div class="langs"><button data-lang="vi">VI</button><button data-lang="ja">JA</button><button data-lang="en">EN</button><button data-lang="ko">KO</button><button data-lang="zh">中文</button></div><a class="btn" id="back">←</a></div></header><main class="wrap"><section class="panel"><h1 data-t="title">Tạo / sửa dự án</h1><div class="grid"><label data-f="name">Tên dự án<input id="name"></label><label data-f="slug">Slug<input id="slug"></label><label data-f="location">Khu vực<input id="location"></label><label data-f="scale">Quy mô<input id="scale"></label><label class="full" data-f="description">Mô tả<textarea id="description"></textarea></label><label data-f="cover">Ảnh/video bìa<input id="cover" type="file" accept="image/*,video/*"></label><label data-f="video">Video dự án<input id="projectVideo" type="file" accept="video/*"></label><label class="full" data-f="gallery">Gallery<input id="gallery" type="file" accept="image/*,video/*" multiple></label></div></section><section class="panel"><div style="display:flex;justify-content:space-between"><h2 data-t="homes">Thông tin từng căn hộ</h2><button id="add" class="btn gold" data-t="add">＋ Thêm căn</button></div><div id="homes"></div></section><section class="panel"><button id="save" class="btn gold" data-t="save">Lưu chính thức lên Supabase</button> <span id="notice"></span></section></main><script>
const T={vi:{title:'Tạo / sửa dự án',homes:'Thông tin từng căn hộ',add:'＋ Thêm căn',save:'Lưu chính thức lên Supabase',back:'← Quay lại',name:'Tên dự án',slug:'Slug',location:'Khu vực',scale:'Quy mô',description:'Mô tả',cover:'Ảnh/video bìa',video:'Video dự án',gallery:'Gallery',fields:['Tên căn','Mã căn','Địa chỉ','Giá bán','Giao thông','Tầng / hướng','Layout','Diện tích','Ban công','Phòng kho','Chiều cao trần','Tầm nhìn','Bãi đỗ xe','Kết cấu · quy mô','Tổng số căn','Hoàn thiện','Phí quản lý','Phí sửa chữa','Phí khác','Quyền sử dụng đất','Khu vực quy hoạch','Đơn vị quản lý','Mô tả căn']},ja:{title:'プロジェクトを作成・編集',homes:'住戸情報',add:'＋ 住戸追加',save:'Supabaseに公開保存',back:'← 戻る',name:'プロジェクト名',slug:'スラッグ',location:'所在地',scale:'規模',description:'説明',cover:'カバー画像/動画',video:'プロジェクト動画',gallery:'ギャラリー',fields:['住戸名','住戸番号','所在地','販売価格','交通','所在階 / 向き','間取り','専有面積','バルコニー','トランクルーム','天井高','眺望','駐車場','構造・規模','総戸数','竣工','管理費','修繕積立金','その他費用','敷地権利','用途地域','管理会社','住戸説明']},en:{title:'Create / edit project',homes:'Residence information',add:'＋ Add home',save:'Save officially to Supabase',back:'← Back',name:'Project name',slug:'Slug',location:'Location',scale:'Scale',description:'Description',cover:'Cover image/video',video:'Project video',gallery:'Gallery',fields:['Home name','Code','Address','Price','Transport','Floor / direction','Layout','Area','Balcony','Storage','Ceiling height','View','Parking','Structure / scale','Total homes','Completion','Management fee','Repair reserve','Other fees','Land rights','Zoning','Management','Home description']},ko:{title:'프로젝트 생성 / 수정',homes:'주택 정보',add:'＋ 주택 추가',save:'Supabase에 공식 저장',back:'← 돌아가기',name:'프로젝트명',slug:'슬러그',location:'지역',scale:'규모',description:'설명',cover:'커버 이미지/영상',video:'프로젝트 영상',gallery:'갤러리',fields:['주택명','코드','주소','가격','교통','층 / 방향','구조','면적','발코니','창고','천장 높이','전망','주차','구조 / 규모','총 세대','준공','관리비','수선 적립금','기타 비용','토지 권리','용도 지역','관리 회사','주택 설명']},zh:{title:'创建 / 编辑项目',homes:'房源信息',add:'＋ 添加房源',save:'正式保存到 Supabase',back:'← 返回',name:'项目名称',slug:'Slug',location:'地区',scale:'规模',description:'说明',cover:'封面图片/视频',video:'项目视频',gallery:'相册',fields:['房源名称','编号','地址','价格','交通','楼层 / 朝向','户型','面积','阳台','储藏室','层高','景观','停车位','结构 / 规模','总户数','竣工','管理费','维修基金','其他费用','土地权利','用途区域','管理公司','房源说明']}};let lang=localStorage.getItem('powerway-lang')||'vi',cfg={},client,data={name:'The Toyomi Tower',slug:'toyomi',location:'Tokyo · Toyomi',scale:'53 floors · 2,046 homes',description:'',media:{cover:[],projectVideo:[],gallery:[]},homes:[{code:'E5209',title:'East Wing · South',media:[]}]};const keys=['title','code','address','price','transport','floorDirection','layout','area','balcony','trunkRoom','ceilingHeight','view','parking','structure','totalHomes','completion','managementFee','repairReserve','otherFees','landRights','zoning','management','text'];const $=id=>document.getElementById(id),esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function setLang(x){lang=x;localStorage.setItem('powerway-lang',x);const t=T[x]||T.vi;document.documentElement.lang=x;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);document.querySelectorAll('[data-f]').forEach(e=>{const key=e.dataset.f;if(t[key])e.firstChild.textContent=t[key]});$('back').textContent=t.back;draw()}function draw(){const t=T[lang]||T.vi;homes.innerHTML=data.homes.map((h,i)=>'<article class="home"><div class="grid">'+keys.map((k,j)=>'<label>'+t.fields[j]+(k==='text'?'<textarea data-h="'+i+'" data-k="'+k+'">'+esc(h[k])+'</textarea>':'<input data-h="'+i+'" data-k="'+k+'" value="'+esc(h[k])+'">')+'</label>').join('')+'<label>Media<input data-file="'+i+'" type="file" accept="image/*,video/*" multiple></label></div><div class="media">'+(h.media||[]).map(m=>(m.type?.startsWith('video/')?'<video src="'+m.url+'" controls muted></video>':'<img src="'+m.url+'">')).join('')+'</div></article>').join('')}async function load(){cfg=await fetch('/api/supabase-config').then(r=>r.ok?r.json():{}).catch(()=>({}));if(cfg.url&&cfg.publishableKey){client=window.supabase.createClient(cfg.url,cfg.publishableKey);const r=await client.from('cms_projects').select('data').eq('slug',new URLSearchParams(location.search).get('project')||'toyomi').maybeSingle();if(r.data?.data)data={...data,...r.data.data}}name.value=data.name;slug.value=data.slug;location.value=data.location;scale.value=data.scale;description.value=data.description;draw();setLang(lang)}async function upload(input,folder){if(!client)throw Error('Chưa cấu hình Supabase URL và publishable key.');return Promise.all([...input.files].map(async f=>{const path=folder+'/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'-');const r=await client.storage.from(cfg.bucket||'project-media').upload(path,f,{upsert:false,contentType:f.type});if(r.error)throw r.error;return{path,url:client.storage.from(cfg.bucket||'project-media').getPublicUrl(path).data.publicUrl,type:f.type,name:f.name}}))}function sync(){data.name=name.value;data.slug=slug.value;data.location=location.value;data.scale=scale.value;data.description=description.value;document.querySelectorAll('[data-h]').forEach(e=>data.homes[+e.dataset.h][e.dataset.k]=e.value)}async function save(){sync();if(!client){notice.textContent='Supabase chưa sẵn sàng';return}const now=new Date().toISOString(),r=await client.from('cms_projects').upsert({slug:data.slug,data:{...data,status:'Published',updatedAt:now},updated_at:now},{onConflict:'slug'}).select('slug').maybeSingle();notice.textContent=r.error||!r.data?(r.error?.message||'Lưu thất bại'):'Đã lưu chính thức'}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));$('add').onclick=()=>{data.homes.push({code:'NEW-'+(data.homes.length+1),title:'New residence',media:[]});draw()};$('save').onclick=save;document.addEventListener('input',e=>{if(e.target.dataset.h)data.homes[+e.target.dataset.h][e.target.dataset.k]=e.target.value});document.addEventListener('change',async e=>{try{if(e.target.id==='cover')data.media.cover=await upload(e.target,'projects/'+slug.value);if(e.target.id==='projectVideo')data.media.projectVideo=await upload(e.target,'projects/'+slug.value);if(e.target.id==='gallery')data.media.gallery.push(...await upload(e.target,'projects/'+slug.value));if(e.target.dataset.file)data.homes[+e.target.dataset.file].media.push(...await upload(e.target,'projects/'+slug.value+'/'+data.homes[+e.target.dataset.file].code));draw()}catch(err){notice.textContent=err.message}});load();
</script></body></html>
