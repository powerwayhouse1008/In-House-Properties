<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Powerway CMS · Property editor</title><style>:root{--bg:#f4f0e8;--paper:#fbfaf7;--ink:#10242a;--muted:#68777a;--line:#d9d6ce;--blue:#214854;--gold:#b47c52}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}.s{max-width:1220px;margin:auto;padding:0 28px}.top{background:var(--ink);color:#fff;padding:18px 0}.bar{display:flex;justify-content:space-between;align-items:center}.brand{font:17px Georgia,serif;letter-spacing:.08em}.nav{display:flex;gap:20px;color:#c8d1d0;font-size:12px}.langs button{background:transparent;color:#fff;border:1px solid #637276;padding:6px 8px;margin-left:4px}.langs .active{background:var(--gold);border-color:var(--gold)}.intro{padding:45px 0 25px}.ey{color:var(--gold);font-size:11px;letter-spacing:.2em;font-weight:bold}.intro h1{font:46px Georgia,serif;font-weight:400;margin:12px 0}.panel{background:var(--paper);border:1px solid var(--line);padding:24px;margin-bottom:20px}.panel h2{font:27px Georgia,serif;font-weight:400;margin:7px 0 18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.full{grid-column:1/-1}label{display:grid;gap:6px;color:var(--muted);font-size:12px}input,select,textarea{border:1px solid var(--line);background:#fff;color:var(--ink);padding:11px;font:inherit}textarea{min-height:86px}.upload{border:1px dashed #bca98e;background:#fff;padding:12px}.upload input{border:0;padding:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.btn{border:0;background:var(--blue);color:#fff;padding:11px 16px;cursor:pointer;font-size:12px}.btn.gold{background:var(--gold);color:#111}.notice{color:#235b4e;font-size:12px;margin-top:12px}@media(max-width:760px){.nav{display:none}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header class="top"><div class="s bar"><a class="brand" href="index.html">POWERWAY · CMS</a><nav class="nav"><a href="admin-v3.html" data-t="dashboard">Dashboard</a><a href="index.html" data-t="public">Public website ↗</a></nav><div class="langs"><button data-l="vi">VI</button><button data-l="ja">JA</button><button data-l="en">EN</button><button data-l="ko">KO</button><button data-l="zh">中文</button></div></div></header><main class="s"><section class="intro"><div class="ey">01 / PROPERTY EDITOR</div><h1 data-t="title">Nhập thông tin dự án & căn hộ</h1><p data-t="desc">Tất cả dữ liệu dưới đây được dùng cho trang public và bản 販売図面 PDF.</p></section><form id="form" onsubmit="save(event)"><section class="panel"><div class="ey">PROJECT / RESIDENCE</div><h2 data-t="identity">Tên dự án và mã căn</h2><div class="grid"><label data-t="project">Tên dự án<input required name="project" placeholder="The Toyomi Tower"></label><label data-t="code">Mã căn / nội bộ<input required name="code" placeholder="E5209"></label><label data-t="wing">Wing<input required name="wing" placeholder="East Wing"></label><label data-t="floor">Tầng<input required name="floor" placeholder="52F / 53F"></label><label data-t="direction">Hướng<input required name="direction" placeholder="South"></label><label data-t="price">Giá bán<input required name="price" placeholder="¥565,000,000"></label><label data-t="area">Diện tích<input required name="area" placeholder="126.26㎡"></label><label data-t="layout">Loại căn<input required name="layout" placeholder="2LDK + WIC + SIC"></label></div></section><section class="panel"><div class="ey">PROJECT INFORMATION</div><h2 data-t="projectInfo">Thông tin dự án</h2><div class="grid"><label class="full" data-t="view">Bay view<input name="bayView" placeholder="Tokyo Bay · Permanent view"></label><label data-t="access">Access / ga gần nhất<input name="access" placeholder="Kachidoki Station · 10 min"></label><label data-t="address">Địa chỉ<input name="address" placeholder="Tokyo-to Chuo-ku Toyomi"></label><label data-t="management">Phí quản lý<input name="management" placeholder="50,250円 / month"></label><label data-t="repair">Quỹ sửa chữa<input name="repair" placeholder="21,840円 / month"></label><label data-t="balcony">Ban công<input name="balcony" placeholder="15.92㎡"></label><label data-t="total">Tổng số căn<input name="total" placeholder="2,046 homes"></label><label data-t="structure">Kết cấu tòa nhà<input name="structure" placeholder="RC · 53 floors"></label><label data-t="completion">Lịch hoàn thành<input name="completion" placeholder="2026-11 completion / 2027-08 delivery"></label><label data-t="description">Mô tả dự án<textarea name="description"></textarea></label></div></section><section class="panel"><div class="ey">MEDIA / PDF</div><h2 data-t="media">Ảnh và video</h2><div class="grid"><label class="upload" data-t="plan">Ảnh mặt bằng<input type="file" name="floorplan" accept="image/*"></label><label class="upload" data-t="living">Ảnh phòng khách<input type="file" name="living" accept="image/*" multiple></label><label class="upload" data-t="kitchen">Ảnh bếp<input type="file" name="kitchen" accept="image/*" multiple></label><label class="upload" data-t="lounge">Ảnh lounge<input type="file" name="lounge" accept="image/*" multiple></label><label class="upload" data-t="bath">Ảnh phòng tắm<input type="file" name="bath" accept="image/*" multiple></label><label class="upload" data-t="video">Video căn hộ<input type="file" name="video" accept="video/mp4,video/webm"></label></div><div class="actions"><button class="btn gold" type="submit" data-t="save">Lưu thông tin</button><button class="btn" type="button" onclick="preview()" data-t="pdf">PDFを保存 / Xuất PDF</button></div><p id="notice" class="notice"></p></section></form></main><script>function save(e){e.preventDefault();notice.textContent='Đã lưu bản nháp đầy đủ thông tin dự án và căn hộ.'}function preview(){const code=document.querySelector('[name=code]').value||'E5209';window.open('zumen.html?unit='+encodeURIComponent(code),'_blank')}const T={vi:{dashboard:'Dashboard',public:'Website công khai ↗',title:'Nhập thông tin dự án & căn hộ',desc:'Tất cả dữ liệu dưới đây được dùng cho trang public và bản 販売図面 PDF.',identity:'Tên dự án và mã căn',project:'Tên dự án',code:'Mã căn / nội bộ',wing:'Wing',floor:'Tầng',direction:'Hướng',price:'Giá bán',area:'Diện tích',layout:'Loại căn',projectInfo:'Thông tin dự án',view:'Bay view',access:'Access / ga gần nhất',address:'Địa chỉ',management:'Phí quản lý',repair:'Quỹ sửa chữa',balcony:'Ban công',total:'Tổng số căn',structure:'Kết cấu tòa nhà',completion:'Lịch hoàn thành',description:'Mô tả dự án',media:'Ảnh và video',plan:'Ảnh mặt bằng',living:'Ảnh phòng khách',kitchen:'Ảnh bếp',lounge:'Ảnh lounge',bath:'Ảnh phòng tắm',video:'Video căn hộ',save:'Lưu thông tin',pdf:'PDFを保存 / Xuất PDF'},ja:{dashboard:'ダッシュボード',public:'公開サイト ↗',title:'プロジェクトと住戸の情報入力',desc:'入力内容は公開ページと販売図面PDFに使用されます。',identity:'プロジェクト名と住戸番号',project:'プロジェクト名',code:'住戸番号 / 内部用',wing:'ウイング',floor:'階数',direction:'方角',price:'販売価格',area:'面積',layout:'間取り',projectInfo:'プロジェクト情報',view:'ベイビュー',access:'交通 / 最寄り駅',address:'所在地',management:'管理費',repair:'修繕積立金',balcony:'バルコニー',total:'総戸数',structure:'建物構造',completion:'竣工・引渡',description:'プロジェクト説明',media:'画像と動画',plan:'間取り図',living:'リビング画像',kitchen:'キッチン画像',lounge:'ラウンジ画像',bath:'浴室画像',video:'住戸動画',save:'保存',pdf:'PDFを保存'},en:{dashboard:'Dashboard',public:'Public website ↗',title:'Project & home information',desc:'These fields power the public page and the sales sheet PDF.',identity:'Project name and residence code',project:'Project name',code:'Residence code / internal',wing:'Wing',floor:'Floor',direction:'Orientation',price:'Price',area:'Area',layout:'Layout',projectInfo:'Project information',view:'Bay view',access:'Access / nearest station',address:'Address',management:'Management fee',repair:'Repair reserve',balcony:'Balcony',total:'Total homes',structure:'Building structure',completion:'Completion / delivery',description:'Project description',media:'Images and video',plan:'Floor plan image',living:'Living room images',kitchen:'Kitchen images',lounge:'Lounge images',bath:'Bathroom images',video:'Residence video',save:'Save information',pdf:'Save PDF'},ko:{dashboard:'대시보드',public:'공개 웹사이트 ↗',title:'프로젝트 및 매물 정보',desc:'입력한 정보는 공개 페이지와 PDF에 사용됩니다.',identity:'프로젝트명 및 매물 번호',project:'프로젝트명',code:'매물 번호 / 내부용',wing:'윙',floor:'층',direction:'향',price:'가격',area:'면적',layout:'구조',projectInfo:'프로젝트 정보',view:'베이 뷰',access:'교통 / 인근 역',address:'주소',management:'관리비',repair:'수선 적립금',balcony:'발코니',total:'총 세대',structure:'건물 구조',completion:'준공 / 입주',description:'프로젝트 설명',media:'이미지 및 영상',plan:'평면도 이미지',living:'거실 이미지',kitchen:'주방 이미지',lounge:'라운지 이미지',bath:'욕실 이미지',video:'매물 영상',save:'정보 저장',pdf:'PDF 저장'},zh:{dashboard:'管理面板',public:'公开网站 ↗',title:'项目与房源信息',desc:'以下信息用于公开页面和销售资料PDF。',identity:'项目名称和房源编号',project:'项目名称',code:'房源编号 / 内部使用',wing:'翼区',floor:'楼层',direction:'朝向',price:'售价',area:'面积',layout:'户型',projectInfo:'项目资料',view:'景观',access:'交通 / 最近车站',address:'地址',management:'管理费',repair:'维修基金',balcony:'阳台',total:'总户数',structure:'建筑结构',completion:'竣工 / 交付',description:'项目说明',media:'图片和视频',plan:'户型图',living:'客厅图片',kitchen:'厨房图片',lounge:'休息厅图片',bath:'浴室图片',video:'房源视频',save:'保存信息',pdf:'保存PDF'}};function setLang(l){const d=T[l]||T.en;document.documentElement.lang=l;document.querySelectorAll('[data-t]').forEach(e=>{if(d[e.dataset.t])e.textContent=d[e.dataset.t]});document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('active',b.dataset.l===l));localStorage.setItem('powerway-admin-lang',l)}document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));setLang(localStorage.getItem('powerway-admin-lang')||'vi');</script></body></html>
