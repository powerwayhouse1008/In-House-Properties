<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Powerway CMS · Login</title><style>:root{--navy:#102d45;--blue:#78c9ea;--line:#d5e8f0;--muted:#607d90}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eaf7fc,#f9fcfd);color:#163047;font-family:Arial,sans-serif}.box{width:min(440px,calc(100% - 32px));background:#fff;border:1px solid var(--line);padding:34px;box-shadow:0 18px 44px rgba(30,110,145,.12)}.mark{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#65bfe8,#e6f9ff);font:24px Georgia,serif;color:var(--navy)}h1{font:400 32px Georgia,serif;color:var(--navy);margin:18px 0 5px}.sub{color:var(--muted);font-size:13px;margin-bottom:24px}label{display:grid;gap:7px;color:var(--muted);font-size:12px;margin-top:14px}input,select{padding:12px;border:1px solid var(--line);border-radius:4px;font:inherit;color:#163047}input:focus,select:focus{outline:2px solid rgba(120,201,234,.4)}.twofa{display:flex;align-items:center;gap:9px;margin-top:16px;color:var(--muted);font-size:12px}.twofa input{width:auto}.code{display:none}.code.show{display:grid}.btn{width:100%;margin-top:22px;padding:13px;border:0;border-radius:999px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.notice{margin-top:14px;padding:10px;background:#eef8fc;color:#2187b7;font-size:12px;display:none}.notice.show{display:block}.hint{margin-top:20px;color:#8999a3;font-size:11px;line-height:1.6}@media(max-width:480px){.box{padding:25px}}
</style></head><body><main class="box"><div class="mark">P</div><h1>Powerway CMS</h1><p class="sub">Đăng nhập hệ thống quản trị nội bộ</p><form id="login"><label>Email<input required type="email" name="email" placeholder="admin@powerway.jp"></label><label>Mật khẩu<input required type="password" name="password" placeholder="••••••••"></label><label>Vai trò<select name="role"><option value="super-admin">Super Admin</option><option value="editor">Editor</option><option value="sales">Sales</option><option value="viewer">Viewer</option></select></label><label class="twofa"><input id="twofaToggle" type="checkbox"> Bật xác thực hai bước (2FA)</label><label id="codeField" class="code">Mã xác thực 2FA<input name="code" inputmode="numeric" placeholder="123456"></label><button class="btn" type="submit">Đăng nhập</button><div id="notice" class="notice">Đăng nhập thành công. Đang chuyển đến dashboard...</div></form><p class="hint">Prototype: tài khoản hiện được lưu phiên local để kiểm thử giao diện. Khi triển khai thật cần kết nối Identity Provider, hash mật khẩu, session server và TOTP.</p></main><script>const toggle=document.getElementById('twofaToggle'),code=document.getElementById('codeField'),form=document.getElementById('login'),notice=document.getElementById('notice');toggle.onchange=()=>code.classList.toggle('show',toggle.checked);form.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form).entries());if(toggle.checked&&!/^\d{6}$/.test(d.code||'')){notice.textContent='Vui lòng nhập mã 2FA gồm 6 chữ số.';notice.classList.add('show');return}localStorage.setItem('powerway-session',JSON.stringify({email:d.email,role:d.role,twofa:toggle.checked,loginAt:new Date().toISOString()}));notice.textContent='Đăng nhập thành công. Đang chuyển đến dashboard...';notice.classList.add('show');setTimeout(()=>location.href='admin.html',500)};</script></body></html>
