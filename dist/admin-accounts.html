<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Powerway CMS · Accounts</title><style>:root{--navy:#102d45;--blue:#78c9ea;--line:#d5e8f0;--muted:#607d90}*{box-sizing:border-box}body{margin:0;background:#f4fbff;color:#163047;font-family:Arial,sans-serif}.top{background:var(--navy);color:#fff;padding:18px 28px;display:flex;justify-content:space-between}.wrap{max-width:1120px;margin:34px auto;padding:0 22px}.back{color:#218bb8;text-decoration:none;font-size:13px}.title{font:400 40px Georgia,serif;color:var(--navy);margin:18px 0}.panel,.table{background:#fff;border:1px solid var(--line);border-radius:5px;padding:22px;box-shadow:0 10px 26px rgba(30,110,145,.06)}.panel{margin:20px 0}.form{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:10px;align-items:end}label{display:grid;gap:6px;font-size:12px;color:var(--muted)}input,select{padding:11px;border:1px solid var(--line);border-radius:4px;font:inherit}.btn{border:0;border-radius:999px;padding:10px 15px;background:var(--blue);color:var(--navy);font-weight:700;cursor:pointer}.btn.danger{background:#f3d8d8;color:#963d3d}.btn.muted{background:#edf1f3;color:#536873}.table{padding:0;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px;border-bottom:1px solid #e5f0f5;font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase;background:#f7fcff}.actions{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#eaf8ef;color:#28714a}.badge.off{background:#f7e6e6;color:#963d3d}.notice{margin-top:12px;color:#2187b7;font-size:13px}@media(max-width:760px){.form{grid-template-columns:1fr}.top{padding:16px}.wrap{margin:22px auto}}
</style></head><body><header class="top"><strong>POWERWAY CMS · ACCOUNTS</strong><a class="back" href="admin.html">← Dashboard</a></header><main class="wrap"><h1 class="title">Quản lý tài khoản</h1><section class="panel"><h2>Tạo tài khoản mới</h2><form id="createForm" class="form"><label>Email<input required type="email" name="email" placeholder="staff@powerway.jp"></label><label>Vai trò<select name="role"><option>Super Admin</option><option>Editor</option><option>Sales</option><option>Viewer</option></select></label><label>Mật khẩu tạm thời<input required type="password" name="password" minlength="8"></label><button class="btn" type="submit">+ Tạo tài khoản</button></form><div id="notice" class="notice"></div></section><section class="table"><table><thead><tr><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Đăng nhập gần nhất</th><th>Thao tác</th></tr></thead><tbody id="users"></tbody></table></section></main><script>const seed=[{email:'owner@powerway.jp',role:'Super Admin',active:true,last:'Today'},{email:'editor@powerway.jp',role:'Editor',active:true,last:'Yesterday'},{email:'sales@powerway.jp',role:'Sales',active:true,last:'2026-10-28'},{email:'viewer@powerway.jp',role:'Viewer',active:false,last:'2026-10-20'}];let users=JSON.parse(localStorage.getItem('powerway-users')||'null')||seed;const tbody=document.getElementById('users'),notice=document.getElementById('notice');function save(){localStorage.setItem('powerway-users',JSON.stringify(users));render()}function render(){tbody.innerHTML=users.map((u,i)=>`<tr><td>${u.email}</td><td><select onchange="changeRole(${i},this.value)"><option ${u.role==='Super Admin'?'selected':''}>Super Admin</option><option ${u.role==='Editor'?'selected':''}>Editor</option><option ${u.role==='Sales'?'selected':''}>Sales</option><option ${u.role==='Viewer'?'selected':''}>Viewer</option></select></td><td><span class="badge ${u.active?'':'off'}">${u.active?'Active':'Disabled'}</span></td><td>${u.last}</td><td><div class="actions"><button class="btn muted" onclick="toggleUser(${i})">${u.active?'Khóa':'Mở khóa'}</button><button class="btn danger" onclick="removeUser(${i})">Xóa</button></div></td></tr>`).join('')}function changeRole(i,role){users[i].role=role;save();notice.textContent='Đã cập nhật quyền tài khoản.'}function toggleUser(i){users[i].active=!users[i].active;save();notice.textContent='Đã cập nhật trạng thái tài khoản.'}function removeUser(i){if(users[i].role==='Super Admin'&&users.filter(x=>x.role==='Super Admin').length===1){notice.textContent='Không thể xóa Super Admin cuối cùng.';return}if(confirm('Xóa tài khoản này?')){users.splice(i,1);save();notice.textContent='Đã xóa tài khoản.'}}createForm.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(createForm).entries());users.push({email:d.email,role:d.role,active:true,last:'Never'});save();createForm.reset();notice.textContent='Đã tạo tài khoản mới.'};render();</script></body></html>
